<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Radio Calipso</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <span class="logo-text">Radio</span>
    <img class="logo-badge" src="RadioCalicoLogoTM.png" alt="Radio Calipso logo" />
    <span class="logo-text">Calipso</span>
  </header>

  <main class="page">
    <img class="np-cover" id="np-cover" alt="" />

    <div class="np-details">
      <h1 class="np-artist" id="np-artist">&nbsp;</h1>
      <h2 class="np-title" id="np-title">&nbsp;</h2>
      <p class="np-album" id="np-album">&nbsp;</p>

      <p class="np-quality" id="np-quality-source"></p>
      <p class="np-quality" id="np-quality-stream">Stream quality: FLAC via HLS (lossless)</p>

      <div class="rate-row">
        <span class="rate-label">Rate this track:</span>
        <button type="button" id="thumb-up" class="thumb-icon" aria-label="Thumbs up">
          &#128077; <span id="up-count">0</span>
        </button>
        <button type="button" id="thumb-down" class="thumb-icon" aria-label="Thumbs down">
          &#128078; <span id="down-count">0</span>
        </button>
      </div>

      <div class="audio-player">
        <button type="button" class="play-btn" id="play-btn" aria-label="Play">&#9654;</button>
        <span class="time-display" id="time-display">0:00 / Live</span>
        <button type="button" class="volume-btn" id="volume-btn" aria-label="Mute">&#128266;</button>
        <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="1" aria-label="Volume" />
      </div>
      <p id="player-status" class="player-status"></p>
      <audio id="radio-player" preload="none"></audio>
    </div>

    <section class="previous-section">
      <h2>Previous tracks:</h2>
      <ul id="recent-list" class="recent-list"></ul>
    </section>
  </main>

  <footer class="site-footer">
    <a href="/api/health">API health check</a>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
  <script src="player.js"></script>
  <script src="now-playing.js"></script>
</body>
</html>
